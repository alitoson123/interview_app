workflows:
  ios-release:
    name: iOS Release & TestFlight Pipeline
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Intervue AI"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alitoson.intervueai
      vars:
        BUNDLE_ID: "com.alitoson.intervueai"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Set up build number
        script: |
          LATEST_TESTFLIGHT_BUILD=""
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST_TESTFLIGHT_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          fi
          if [ -z "$LATEST_TESTFLIGHT_BUILD" ] || [ "$LATEST_TESTFLIGHT_BUILD" -le 0 ] 2>/dev/null; then
            LATEST_TESTFLIGHT_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "")
          fi

          if [ -n "$LATEST_TESTFLIGHT_BUILD" ] && [ "$LATEST_TESTFLIGHT_BUILD" -gt 0 ] 2>/dev/null; then
            CALCULATED_BUILD=$((LATEST_TESTFLIGHT_BUILD + 1))
            echo "Fetched latest TestFlight build ($LATEST_TESTFLIGHT_BUILD). Next build: $CALCULATED_BUILD"
          else
            # TestFlight already has version 1.0 (2). Use Codemagic auto-incrementing build counter
            # plus offset to guarantee it's always greater than existing TestFlight builds and increments each build.
            BASE_OFFSET=5
            CALCULATED_BUILD=$((${BUILD_NUMBER:-1} + BASE_OFFSET))
            echo "TestFlight build query fallback. Using Codemagic build (${BUILD_NUMBER:-1}) + offset ($BASE_OFFSET) = $CALCULATED_BUILD"
          fi

          echo "Setting BUILD_NUMBER=$CALCULATED_BUILD"
          echo "BUILD_NUMBER=$CALCULATED_BUILD" >> $CM_ENV
      - name: Disable Swift Package Manager in Flutter
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install --repo-update \;
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj --warn-only
      - name: Build IPA for App Store / TestFlight
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-simulator-appetize:
    name: iOS Simulator Build (for Appetize.io)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager in Flutter
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install --repo-update \;
      - name: Build iOS App for Simulator
        script: |
          flutter build ios --simulator
      - name: Package Runner.app into zip for Appetize
        script: |
          cd build/ios/iphonesimulator
          zip -r -X app-simulator.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/app-simulator.zip
      - /tmp/xcodebuild_logs/*.log
